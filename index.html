<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Подбор аналогов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1EFE8;
    --bg-elevated:#FFFFFF;
    --ink:#24303D;
    --ink-soft:#69727D;
    --line:#DAD5C8;
    --user:#33445C;
    --user-ink:#F1EFE8;
    --strong:#2F6F62;
    --strong-bg:#E7EFEC;
    --partial:#B57A22;
    --partial-bg:#F3EADA;
    --danger:#9C4F3E;
    --radius:10px;
    --mono:'IBM Plex Mono', ui-monospace, monospace;
    --sans:'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:720px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--bg);
  }

  /* ---------- header ---------- */
  header{
    padding:28px 20px 18px;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  h1{
    margin:0 0 4px;
    font-size:22px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  header p{
    margin:0;
    font-size:13.5px;
    color:var(--ink-soft);
    line-height:1.5;
  }

  /* ---------- thread ---------- */
  .thread{
    flex:1;
    overflow-y:auto;
    padding:20px 16px 8px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .msg{
    max-width:88%;
    animation:rise .25s ease both;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }
  .msg.user{
    align-self:flex-end;
    background:var(--user);
    color:var(--user-ink);
    padding:10px 14px;
    border-radius:var(--radius) var(--radius) 4px var(--radius);
    font-size:14.5px;
    line-height:1.5;
  }
  .msg.bot-text{
    align-self:flex-start;
    background:var(--bg-elevated);
    border:1px solid var(--line);
    padding:10px 14px;
    border-radius:var(--radius) var(--radius) var(--radius) 4px;
    font-size:14.5px;
    line-height:1.5;
  }
  .msg.error{
    border-color:var(--danger);
    color:var(--danger);
  }

  /* ---------- result group ---------- */
  .result-group{
    align-self:flex-start;
    width:100%;
    max-width:100%;
  }
  .result-head{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:8px;
    flex-wrap:wrap;
  }
  .result-head .fp{
    font-weight:700;
    font-size:15px;
  }
  .tag{
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:2px 7px;
    border-radius:20px;
    border:1px solid var(--line);
    color:var(--ink-soft);
    background:var(--bg-elevated);
  }
  .result-empty{
    font-size:13.5px;
    color:var(--ink-soft);
    background:var(--bg-elevated);
    border:1px dashed var(--line);
    border-radius:var(--radius);
    padding:12px 14px;
  }
  .result-block + .result-block{
    margin-top:18px;
  }

  /* ---------- card (signature element: catalog index card) ---------- */
  .cards{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .card{
    position:relative;
    background:var(--bg-elevated);
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px 14px 12px 16px;
    box-shadow:0 1px 0 var(--line);
  }
  .card::before{
    content:attr(data-pid);
    position:absolute;
    top:-9px;
    left:14px;
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.05em;
    background:var(--bg);
    color:var(--ink-soft);
    padding:0 6px;
  }
  .card-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    margin-bottom:4px;
  }
  .card-name{
    font-weight:600;
    font-size:14.5px;
  }
  .card-vendor{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:1px;
  }
  .verdict{
    flex:0 0 auto;
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:3px 8px;
    border-radius:20px;
    white-space:nowrap;
  }
  .verdict.strong{ color:var(--strong); background:var(--strong-bg); }
  .verdict.partial{ color:var(--partial); background:var(--partial-bg); }
  .card-reason{
    font-size:13px;
    color:var(--ink);
    line-height:1.5;
    margin-top:6px;
  }

  /* ---------- feedback ---------- */
  .fb{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
    margin-top:11px;
    padding-top:9px;
    border-top:1px solid var(--line);
  }
  .fb-label{
    font-size:12px;
    color:var(--ink-soft);
    margin-right:2px;
  }
  .fb-btn{
    background:var(--bg-elevated);
    border:1px solid var(--line);
    border-radius:20px;
    color:var(--ink-soft);
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:4px 10px;
  }
  .fb-btn:hover:not(:disabled){
    border-color:var(--ink-soft);
    color:var(--ink);
  }
  .fb-btn.on-yes{
    color:var(--strong);
    background:var(--strong-bg);
    border-color:var(--strong);
  }
  .fb-btn.on-no{
    color:var(--danger);
    background:var(--bg-elevated);
    border-color:var(--danger);
  }
  .fb-note{
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.04em;
    color:var(--ink-soft);
  }
  .fb-note.err{ color:var(--danger); }

  .fb-group{ margin-top:10px; }
  .fb-link{
    background:none;
    border:none;
    padding:0;
    color:var(--ink-soft);
    font-family:var(--sans);
    font-size:12.5px;
    font-weight:500;
    text-decoration:underline;
    text-underline-offset:2px;
  }
  .fb-link:hover{ color:var(--ink); }
  .fb-form{
    display:flex;
    gap:8px;
    margin-top:8px;
    align-items:flex-start;
  }
  .fb-form textarea{
    flex:1;
    resize:none;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:9px 11px;
    font-family:var(--sans);
    font-size:13.5px;
    color:var(--ink);
    background:var(--bg-elevated);
  }
  .fb-send{
    padding:0 14px;
    height:38px;
    font-size:13px;
  }

  /* ---------- typing indicator ---------- */
  .typing{
    align-self:flex-start;
    display:flex;
    gap:4px;
    padding:12px 14px;
    background:var(--bg-elevated);
    border:1px solid var(--line);
    border-radius:var(--radius) var(--radius) var(--radius) 4px;
  }
  .typing span{
    width:6px; height:6px; border-radius:50%;
    background:var(--ink-soft);
    animation:bounce 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{
    0%,80%,100%{transform:translateY(0); opacity:.5;}
    40%{transform:translateY(-4px); opacity:1;}
  }
  @media (prefers-reduced-motion: reduce){
    .msg{animation:none;}
    .typing span{animation:none; opacity:.7;}
  }

  /* ---------- input ---------- */
  #form{
    display:flex;
    gap:8px;
    padding:14px 16px 20px;
    border-top:1px solid var(--line);
    background:var(--bg);
  }
  #input{
    flex:1;
    resize:none;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:11px 13px;
    font-family:var(--sans);
    font-size:14.5px;
    color:var(--ink);
    background:var(--bg-elevated);
    max-height:120px;
  }
  #input:focus{
    outline:2px solid var(--user);
    outline-offset:1px;
  }
  button{
    border:none;
    border-radius:var(--radius);
    background:var(--user);
    color:var(--user-ink);
    padding:0 18px;
    font-family:var(--sans);
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }
  button:disabled{
    opacity:.5;
    cursor:default;
  }
  button:focus-visible, textarea:focus-visible{
    outline:2px solid var(--user);
    outline-offset:2px;
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="eyebrow">Каталог · подбор аналогов</div>
    <h1>Спросите про замену</h1>
    <p>Опишите иностранный продукт или нужный функционал — подберём варианты из портфеля.</p>
  </header>

  <div class="thread" id="thread"></div>

  <form id="form">
    <textarea id="input" rows="1" placeholder="Например: нужен аналог Adobe Photoshop" required></textarea>
    <button type="submit" id="send">Спросить</button>
  </form>

</div>

<script>
// ==========================================================
// НАСТРОЙКА: production-URL вебхуков n8n
// (нода Webhook → вкладка Webhook URLs → Production URL)
// ==========================================================
const WEBHOOK_URL  = 'https://analogi-mvp-danilm3.amvera.io/webhook/match';
const FEEDBACK_URL = 'https://analogi-mvp-danilm3.amvera.io/webhook/feedback';

// product_id для отзыва «ни один вариант не подошёл»: строки такого вида
// не относятся к конкретной карточке и не попадают в mapping_gold (там только accepted).
const NO_MATCH_PID = '__none__';

const thread = document.getElementById('thread');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function addUserMsg(text){
  const m = el('div', 'msg user', text);
  thread.appendChild(m);
  scrollDown();
}

function addBotText(text, isError){
  const m = el('div', 'msg bot-text' + (isError ? ' error' : ''), text);
  thread.appendChild(m);
  scrollDown();
}

function addTyping(){
  const t = el('div', 'typing');
  t.id = 'typing-indicator';
  t.appendChild(el('span'));
  t.appendChild(el('span'));
  t.appendChild(el('span'));
  thread.appendChild(t);
  scrollDown();
  return t;
}

function removeTyping(t){
  if (t && t.parentNode) t.parentNode.removeChild(t);
}

function scrollDown(){
  requestAnimationFrame(() => { thread.scrollTop = thread.scrollHeight; });
}

const STATUS_LABEL = {
  no_confident_match: 'нет уверенного совпадения',
  too_many_refine_query: 'слишком много вариантов — уточните'
};
const SOURCE_LABEL = {
  mapping: 'проверено экспертом',
  rag: 'по смыслу из каталога'
};

// ---------- отзывы (таблица feedback) ----------

// Отправка одного отзыва. Валидация на стороне n8n требует
// request_id + product_id + verdict; остальное — необязательно.
async function sendFeedback(payload){
  const res = await fetch(FEEDBACK_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json().catch(() => ({}));
  if (data && data.ok === false) throw new Error(data.error || 'отзыв отклонён');
  return data;
}

// Если P1 не выделил иностранный продукт (foreign_product = null),
// сам текст запроса — единственный контекст отзыва, кладём его в comment.
function withQueryContext(ctx, comment){
  const parts = [];
  if (!ctx.foreign_product) parts.push('запрос: ' + ctx.query);
  if (comment) parts.push(comment);
  return parts.length ? parts.join(' | ') : null;
}

// Две кнопки под карточкой: голос уходит сразу, вердикт можно переключить.
function cardFeedback(ctx, m){
  const row = el('div', 'fb');
  row.appendChild(el('span', 'fb-label', 'Этот вариант:'));

  const yes = el('button', 'fb-btn', 'подходит');
  const no  = el('button', 'fb-btn', 'не то');
  yes.type = 'button'; no.type = 'button';
  yes.setAttribute('aria-pressed', 'false');
  no.setAttribute('aria-pressed', 'false');
  const note = el('span', 'fb-note');

  let current = null, busy = false;

  async function vote(verdict){
    if (busy || current === verdict) return;
    busy = true;
    yes.disabled = no.disabled = true;
    note.className = 'fb-note';
    note.textContent = '…';
    try{
      await sendFeedback({
        request_id: ctx.request_id,
        product_id: m.product_id,
        verdict: verdict,
        foreign_product: ctx.foreign_product || null,
        comment: withQueryContext(ctx, null)
      });
      current = verdict;
      const isYes = verdict === 'accepted';
      yes.classList.toggle('on-yes', isYes);
      no.classList.toggle('on-no', !isYes);
      yes.setAttribute('aria-pressed', String(isYes));
      no.setAttribute('aria-pressed', String(!isYes));
      note.textContent = 'записали';
    }catch(err){
      note.className = 'fb-note err';
      note.textContent = 'не отправилось — попробуйте ещё раз';
    }finally{
      busy = false;
      yes.disabled = no.disabled = false;
    }
  }

  yes.addEventListener('click', () => vote('accepted'));
  no.addEventListener('click', () => vote('rejected'));
  row.append(yes, no, note);
  return row;
}

// Отзыв на весь результат: «ничего не подошло» + необязательный комментарий.
// Пишется как rejected на служебный product_id — сигнал о дыре в каталоге/поиске.
function groupFeedback(ctx, isEmpty){
  const box = el('div', 'fb-group');
  const link = el('button', 'fb-link',
    isEmpty ? 'Подсказать, что искали' : 'Ничего не подошло');
  link.type = 'button';
  box.appendChild(link);

  link.addEventListener('click', () => {
    link.remove();
    const wrap = el('div', 'fb-form');
    const ta = el('textarea');
    ta.rows = 2;
    ta.placeholder = isEmpty
      ? 'Какой продукт или функционал был нужен?'
      : 'Что не так с вариантами? (необязательно)';
    const btn = el('button', 'fb-send', 'Отправить');
    btn.type = 'button';
    wrap.append(ta, btn);
    box.appendChild(wrap);
    ta.focus();
    scrollDown();

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.textContent = '…';
      try{
        await sendFeedback({
          request_id: ctx.request_id,
          product_id: NO_MATCH_PID,
          verdict: 'rejected',
          foreign_product: ctx.foreign_product || null,
          comment: withQueryContext(ctx, ta.value.trim())
        });
        wrap.replaceWith(el('div', 'fb-note', 'спасибо, записали'));
      }catch(err){
        btn.disabled = false;
        btn.textContent = 'Отправить';
        const errNote = box.querySelector('.fb-note.err') || el('div', 'fb-note err');
        errNote.textContent = 'не отправилось — попробуйте ещё раз';
        box.appendChild(errNote);
      }
    });
  });

  return box;
}

// ---------- рендер ----------

function renderResults(payload, query){
  const group = el('div', 'result-group');

  (payload.results || []).forEach(r => {
    const block = el('div', 'result-block');
    const ctx = {
      request_id: payload.request_id,
      foreign_product: r.foreign_product || null,
      query: query
    };

    const head = el('div', 'result-head');
    // если P1 не выделил продукт — показываем сам запрос, а не безликое «Запрос»
    head.appendChild(el('span', 'fp', r.foreign_product || ('«' + query + '»')));
    if (r.source) head.appendChild(el('span', 'tag', SOURCE_LABEL[r.source] || r.source));
    block.appendChild(head);

    const empty = r.status === 'no_confident_match'
      || r.status === 'too_many_refine_query'
      || !r.matches || !r.matches.length;

    if (empty) {
      block.appendChild(el('div', 'result-empty', STATUS_LABEL[r.status] || 'Ничего не найдено.'));
      if (payload.request_id) block.appendChild(groupFeedback(ctx, true));
      group.appendChild(block);
      return;
    }

    const cards = el('div', 'cards');
    r.matches.forEach(m => {
      const card = el('div', 'card');
      card.setAttribute('data-pid', m.product_id || '');

      const top = el('div', 'card-top');
      const left = el('div');
      left.appendChild(el('div', 'card-name', m.name || ''));
      if (m.vendor) left.appendChild(el('div', 'card-vendor', m.vendor));
      top.appendChild(left);
      top.appendChild(el('span', 'verdict ' + (m.verdict === 'strong' ? 'strong' : 'partial'),
        m.verdict === 'strong' ? 'подходит' : 'частично'));
      card.appendChild(top);

      if (m.reason) card.appendChild(el('div', 'card-reason', m.reason));
      // без request_id отзыв не примут — кнопки показываем только когда он есть
      if (payload.request_id && m.product_id) card.appendChild(cardFeedback(ctx, m));
      cards.appendChild(card);
    });
    block.appendChild(cards);
    if (payload.request_id) block.appendChild(groupFeedback(ctx, false));
    group.appendChild(block);
  });

  thread.appendChild(group);
  scrollDown();
}

async function ask(query){
  const typing = addTyping();
  sendBtn.disabled = true;
  try{
    const res = await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    removeTyping(typing);

    if (data.status === 'clarification_needed') {
      addBotText(data.question || 'Уточните, пожалуйста, запрос.');
    } else if (data.results) {
      renderResults(data, query);
    } else {
      addBotText('Пустой ответ от сервера.', true);
    }
  } catch(err){
    removeTyping(typing);
    addBotText('Не удалось получить ответ (' + err.message + '). Проверьте адрес webhook и CORS-настройки в n8n.', true);
  } finally {
    sendBtn.disabled = false;
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  addUserMsg(text);
  input.value = '';
  input.style.height = 'auto';
  ask(text);
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

addBotText('Здравствуйте! Напишите, для какого продукта нужен аналог, или опишите нужный функционал.');
</script>
</body>
</html>
